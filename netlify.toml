[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PUBLIC_SITE_ENV = "production"

[context.stage]
  command = "npm run build"
[context.stage.environment]
  PUBLIC_SITE_ENV = "staging"

[context.branch-deploy]
  command = "npm run build"
[context.branch-deploy.environment]
  PUBLIC_SITE_ENV = "staging"

[context.deploy-preview]
  command = "npm run build"
[context.deploy-preview.environment]
  PUBLIC_SITE_ENV = "staging"

[functions]
  directory = "netlify/functions"

# Cabeceras para archivos estáticos (las páginas SSR las reciben desde
# src/middleware.ts, porque estas reglas no aplican a la función).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
